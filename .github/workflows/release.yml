# Builds Keptwise-Setup.exe on a Windows machine at GitHub and puts it
# on a GitHub Release, whenever a version tag like v1.2.0 is pushed:
#
#   git tag v1.2.0
#   git push origin v1.2.0
#
# The release notes are that version's line in CHANGELOG.md (keep it to a
# sentence or two), followed by how to install.
#
# A tag with a dash, like v0.2.0-dev.1, makes a dev build instead: a
# pre-release with a one-line note, which the app's update check ignores.
#
# It can also be started by hand (Actions tab -> Release -> Run workflow, or
# `gh workflow run release.yml -f tag=v1.2.0`) to build the chosen branch and
# put the installer on a tag that already exists, for example after a build fix.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to release, like v1.2.0"
        required: true

env:
  # The version tag: the pushed tag, or the one typed in when started by hand.
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write # needed to create the release

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      # Not actions/setup-python: its Windows 3.12 is python.org's last
      # 3.12 build, with OpenSSL 3.0, and TikTok refuses that handshake.
      # uv's Python 3.12 has OpenSSL 3.5 (same as local builds).
      - uses: astral-sh/setup-uv@v6

      - name: Make .venv with uv's Python 3.12
        shell: pwsh
        run: |
          uv python install 3.12
          $python = uv python find --managed-python 3.12
          & $python -m venv .venv
          & .venv\Scripts\python.exe -c "import ssl, sys; print(sys.version, ssl.OPENSSL_VERSION)"

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") |
            Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { choco install innosetup --no-progress -y }

      - name: Run the tests
        shell: powershell
        run: .\scripts\test.ps1

      - name: Build the installer
        shell: powershell
        # No start-up check here: the build machine has no screen for the window.
        run: .\packaging\build.ps1 -Version "$env:RELEASE_TAG" -SkipSmokeTest

      - name: Write the release notes
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG.Contains("-")) {
            Set-Content -Path release-notes.md -Value "Dev build for testing." -Encoding utf8
            exit 0
          }
          $version = $env:RELEASE_TAG.TrimStart("v")
          $changelog = Get-Content -Raw CHANGELOG.md
          $pattern = "(?ms)^## \[?$([regex]::Escape($version))\]?[^\n]*\n(.*?)(?=^## |\z)"
          $notes = if ($changelog -match $pattern) { $Matches[1].Trim() } else { "Keptwise $version" }
          $notes += "`n`n## Install`n`n" +
            "1. Download **Keptwise-Setup.exe** below and open it.`n" +
            "2. If Windows says *Windows protected your PC*, click **More info**, then **Run anyway**.`n" +
            "3. Already have Keptwise? Press **Update now** in the app instead. Your saves and settings are kept."
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # --verify-tag: never create a new tag here, only use one that exists.
          # Build the list this way: "$x = if (...) { @(...) }" turns a one-item list back into a plain
          # string, and splatting a string passes its letters one by one.
          $extra = @()
          if ($env:RELEASE_TAG.Contains("-")) { $extra += "--prerelease" }
          gh release create "$env:RELEASE_TAG" dist/Keptwise-Setup.exe --verify-tag `
            --title "Keptwise $env:RELEASE_TAG" --notes-file release-notes.md @extra
